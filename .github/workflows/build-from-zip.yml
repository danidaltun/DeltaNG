name: Build Delta from ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Delta source
        run: |
          set -e
          Z=""
          for f in DeltaNG.zip DeltaNG_Ready.zip DeltaNG-master.zip; do
            [ -f "$f" ] && Z="$f" && break
          done
          [ -n "$Z" ] || { echo "zip not found"; exit 1; }
          echo "ZIP=$Z"
          rm -rf /tmp/d && mkdir /tmp/d
          unzip -o "$Z" -d /tmp/d
          ROOT=$(find /tmp/d -maxdepth 3 -type d -name V2rayNG | head -1)
          [ -n "$ROOT" ] || { echo "V2rayNG missing in zip"; find /tmp/d | head -50; exit 1; }
          SRC=$(dirname "$ROOT")
          cp -a "$SRC"/. .
          test -d V2rayNG

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Get Xray AAR
        run: |
          mkdir -p V2rayNG/app/libs
          curl -fL "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar" -o V2rayNG/app/libs/libv2ray.aar
          ls -lh V2rayNG/app/libs/libv2ray.aar

      - name: Assemble Release
        run: |
          cd V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DeltaNG-APK
          path: V2rayNG/app/build/outputs/apk/**/*.apk
